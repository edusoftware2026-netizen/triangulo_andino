<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" fill="none">
  <!-- Chocolate Base Container (#3E322C) with Gold Border (#D4A373) -->
  <rect x="4" y="4" width="112" height="112" rx="18" fill="#3E322C" stroke="#D4A373" stroke-width="3" stroke-opacity="0.55" />
  
  <!-- Outer Golden Triangle (Chile · Bolivia · Perú / Deisy · Tamara · Nayra) -->
  <polygon
    points="60,20 100,92 20,92"
    fill="#D4A373"
    fill-opacity="0.18"
    stroke="#D4A373"
    stroke-width="5"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
  
  <!-- Inner Sacred Andean Triangle -->
  <polygon
    points="60,44 82,82 38,82"
    fill="none"
    stroke="#D4A373"
    stroke-width="3.2"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
  
  <!-- Subtle Apex Star / Sun Point (Inti / Gold Accent) -->
  <circle cx="60" cy="33" r="3" fill="#F9F6F0" />
</svg>